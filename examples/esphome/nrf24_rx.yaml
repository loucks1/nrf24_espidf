# ESPHome (nrf24_espidf component) RECEIVER - interoperability example
# Pair with either transmitter: arduino/rf24_tx (TMRh20 RF24) or
# esphome/nrf24_tx.yaml (ESPHome). All four examples share the same
# settings and payload format - see examples/README.md.
#
# Board: ESP32-WROOM-32 DevKit (esp32dev), ESP-IDF framework.
# Wiring: SCK=GPIO18 MOSI=GPIO23 MISO=GPIO19, CSN=GPIO21, CE=GPIO22, IRQ n/c.
# Settings: channel 76, 1 Mbps, PA_LOW, fixed 32-byte payload,
# dynamic payloads OFF, auto-ack ON, CRC-16, retries (5,15),
# pipe 1 address bytes (written in this order): E1 F0 F0 F0 F0
#   -> the BYTE-ARRAY overload is used on purpose, so the on-air byte
#      order is visible in the code (the uint64_t overload produces
#      identical register bytes).

esphome:
  name: nrf24-rx
  friendly_name: nRF24 RX (RF24 interop example)
  on_boot:
    priority: -100   # run after the nrf24 component's own setup()
    then:
      - lambda: |-
          auto *radio = id(my_nrf24);

          // --- Apply every setting explicitly ------------------------
          // Everything the Arduino side sets on its radio is set here
          // too, so the full configuration that has to match is visible
          // in one place.
          radio->set_address_width(5);
          radio->set_payload_size(32);
          radio->disable_dynamic_payloads();
          radio->set_crc_length(nRF24L01::RF24_CRC_16);
          radio->set_auto_ack(true);
          radio->set_retries(5, 15);

          // Byte-array overload: it writes the bytes to RX_ADDR_P1 in
          // array order, exactly like RF24's byte-array overload on the
          // Arduino side.
          static const uint8_t addr[5] = {0xE1, 0xF0, 0xF0, 0xF0, 0xF0};
          radio->open_reading_pipe(1, addr);

          // Reception only happens through callbacks: the component's
          // loop() does not deliver packets while no callback is
          // registered, so registering one is not optional.
          radio->add_on_data_callback([](const uint8_t *data, uint8_t len) {
            if (len < 4) {
              ESP_LOGW("nrf24_rx", "Short packet: len=%d", len);
              return;
            }
            uint32_t seq;
            memcpy(&seq, data, sizeof(seq));
            id(rx_count) += 1;
            if (id(expected_seq) != 0 && seq != id(expected_seq)) {
              ESP_LOGE("nrf24_rx", "*** GAP: expected seq=%lu, got seq=%lu (missed %ld) ***",
                       (unsigned long) id(expected_seq), (unsigned long) seq,
                       (long) (seq - id(expected_seq)));
            }
            id(expected_seq) = seq + 1;
            ESP_LOGI("nrf24_rx", "RX count=%d seq=%lu text=%.28s",
                     id(rx_count), (unsigned long) seq, (const char *) (data + 4));
            if (id(rx_count) == 100) {
              ESP_LOGI("nrf24_rx", "*** 100 PACKETS RECEIVED - check log above for GAP lines ***");
            }
          });

          radio->start_listening();
          ESP_LOGI("nrf24_rx", "=== RX LISTENING (ch 76, 1 Mbps, PA_LOW, pipe 1 E1 F0 F0 F0 F0) ===");

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

# Fill these in the same way as your other ESPHome devices
# (secrets / your own wifi block)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome

api:

spi:
  - id: nrf24_spi
    interface: spi2
    clk_pin: GPIO18
    mosi_pin: GPIO23
    miso_pin: GPIO19

external_components:
  - source:
      type: git
      url: https://github.com/loucks1/nrf24_espidf
      path: components
    components: [nrf24]

nrf24:
  id: my_nrf24
  spi_id: nrf24_spi
  cs_pin: GPIO21
  ce_pin: GPIO22
  channel: 76
  rf_data_rate: "1MBPS"
  pa_level: "LOW"

globals:
  - id: rx_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: expected_seq
    type: uint32_t
    restore_value: false
    initial_value: '0'
