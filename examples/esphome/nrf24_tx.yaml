# ESPHome (nrf24_espidf component) TRANSMITTER - interoperability example
# Pair with either receiver: arduino/rf24_rx (TMRh20 RF24) or
# esphome/nrf24_rx.yaml (ESPHome). All four examples share the same
# settings and payload format - see examples/README.md.
#
# Board: ESP32-WROOM-32 DevKit (esp32dev), ESP-IDF framework.
# Wiring: SCK=GPIO18 MOSI=GPIO23 MISO=GPIO19, CSN=GPIO21, CE=GPIO22, IRQ n/c.
# Settings: channel 76, 1 Mbps, PA_LOW, fixed 32-byte payload,
# dynamic payloads OFF, auto-ack ON, CRC-16, retries (5,15),
# TX address bytes (written in this order): E1 F0 F0 F0 F0
#   -> the BYTE-ARRAY overload is used on purpose, so the on-air byte
#      order is visible in the code (the uint64_t overload produces
#      identical register bytes).
#
# This node is TX-only from a fresh boot: it never calls start_listening()
# or stop_listening(). Listen-then-transmit role swapping within one boot
# is outside the scope of the tested examples.

esphome:
  name: nrf24-tx
  friendly_name: nRF24 TX (RF24 interop example)
  on_boot:
    priority: -100   # run after the nrf24 component's own setup()
    then:
      - lambda: |-
          auto *radio = id(my_nrf24);

          // --- Apply every setting explicitly ------------------------
          // Everything the Arduino side sets on its radio is set here
          // too, so the full configuration that has to match is visible
          // in one place.
          radio->set_address_width(5);
          radio->set_payload_size(32);
          radio->disable_dynamic_payloads();
          radio->set_crc_length(nRF24L01::RF24_CRC_16);
          radio->set_auto_ack(true);
          radio->set_retries(5, 15);

          // Byte-array overload: it writes the bytes to TX_ADDR and
          // RX_ADDR_P0 in array order, exactly like RF24's byte-array
          // overload on the Arduino side.
          static const uint8_t addr[5] = {0xE1, 0xF0, 0xF0, 0xF0, 0xF0};
          radio->open_writing_pipe(addr);

          ESP_LOGI("nrf24_tx", "=== TX READY (ch 76, 1 Mbps, PA_LOW, addr E1 F0 F0 F0 F0) ===");

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

# Fill these in the same way as your other ESPHome devices
# (secrets / your own wifi block)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome

api:

spi:
  - id: nrf24_spi
    interface: spi2
    clk_pin: GPIO18
    mosi_pin: GPIO23
    miso_pin: GPIO19

external_components:
  - source:
      type: git
      url: https://github.com/loucks1/nrf24_espidf
      path: components
    components: [nrf24]

nrf24:
  id: my_nrf24
  spi_id: nrf24_spi
  cs_pin: GPIO21
  ce_pin: GPIO22
  channel: 76
  rf_data_rate: "1MBPS"
  pa_level: "LOW"

globals:
  - id: tx_seq
    type: uint32_t
    restore_value: false
    initial_value: '1'
  - id: tx_ok
    type: int
    restore_value: false
    initial_value: '0'
  - id: tx_fail
    type: int
    restore_value: false
    initial_value: '0'

interval:
  - interval: 1s
    then:
      - lambda: |-
          // Same payload format as the Arduino sketches:
          // uint32 seq little-endian in bytes 0-3, "HELLO_NRF24" at byte 4,
          // rest zero, 32 bytes total.
          uint8_t payload[32];
          memset(payload, 0, sizeof(payload));
          uint32_t seq = id(tx_seq);
          memcpy(payload, &seq, sizeof(seq));
          memcpy(payload + 4, "HELLO_NRF24", 11);

          bool ok = id(my_nrf24)->write(payload, sizeof(payload));
          if (ok) {
            id(tx_ok) += 1;
          } else {
            id(tx_fail) += 1;
          }
          ESP_LOGI("nrf24_tx", "TX seq=%lu %s (ok=%d fail=%d)",
                   (unsigned long) seq, ok ? "OK" : "FAIL",
                   id(tx_ok), id(tx_fail));
          id(tx_seq) = seq + 1;
